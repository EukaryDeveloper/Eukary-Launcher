name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # 纯逻辑断言不需要网络，CI 直接跑；端到端下载/启动需要网络与桌面环境，留在本地手动验证
      - name: Smoke (pure logic)
        run: dotnet run --project EukaryLauncher.Smoke -c Release --no-build

      - name: Publish (self-contained single file)
        run: >
          dotnet publish EukaryLauncher.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EukaryLauncher-win-x64
          path: publish/

      # 打包成单个 zip：Release 页面只留成品，不要散落的 exe 与 dll
      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path "publish/*" -DestinationPath "EukaryLauncher-${{ github.ref_name }}-win-x64.zip"

      # 图形安装包由维护者在本机构建（installer 脚本未入库），不在此处自动发布
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EukaryLauncher-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
